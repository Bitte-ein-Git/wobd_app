<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Bitte ein Git!">
    <title>WOBD</title>
    <!-- CSS is now loaded from the assets subfolder -->
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header>
        <h1>WOBD</h1>
        <p>Finde den OBD-Port in deinem Auto</p>
    </header>
    <main>
        <!-- Search field at the top -->
        <div class="control-group">
            <input type="text" id="search" placeholder="Modellnamen oder Hersteller direkt suchen..." disabled>
        </div>

        <button id="back-btn" class="hidden">Zurück zur Übersicht</button>

        <!-- 3-Column Grid for Manufacturers -->
        <div id="manufacturer-grid" class="manufacturer-grid"></div>

        <!-- List of Models for selected Manufacturer -->
        <div id="model-list-container" class="hidden">
            <h2 id="selected-manufacturer-title"></h2>
            <ul id="model-list" class="model-list"></ul>
        </div>

        <!-- Search Results List -->
        <div id="search-results-container" class="hidden">
            <h2>Suchergebnisse</h2>
            <ul id="search-list" class="model-list"></ul>
        </div>

        <!-- Result display area for specific OBD info -->
        <div id="results" class="results-container"></div>
    </main>
    <footer>
        <p>&copy; 2026 Bitte ein Git!</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
